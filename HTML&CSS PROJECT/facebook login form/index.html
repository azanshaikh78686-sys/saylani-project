<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Login UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <!-- LEFT SIDE -->
        <section class="left-side">

            <div class="facebook-logo">
                f
            </div>

            <div class="left-content">

                <div class="text">
                    <h1>
                        Explore<br>
                        the things<br>
                        <span>you love.</span>
                    </h1>
                </div>

                <div class="image-area">
                    <img src="./images/U45qBJmWVHU.webp" alt="Social media preview">
                </div>

            </div>

        </section>


        <!-- RIGHT SIDE -->
        <section class="right-side">

            <div class="login-box">

                <h2>Log in to Facebook</h2>

                <input
                    type="text"
                    placeholder="Email address or mobile number"
                >

                <input
                    type="password"
                    placeholder="Password"
                >

                <button class="login-btn">
                    Log in
                </button>
                

                <a href="#" class="forgot">
                    Forgotten password?
                     <a href="./create.htmls" class="create-account">
                Create new account
            </a>

                <a href="./create.html" class="create-account">
                    Create new account
                </a>

                <div class="line"></div>

                <button class="create-btn">
                    Create new account
                </button>

                <div class="meta">
                    <span>∞</span> Meta
                </div>

            </div>

        </section>

    </main>

</body>
</html>
