<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Facebook Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-page">

        <!-- LEFT SIDE -->

        <div class="login-left">

            <div class="facebook-logo">
                f
            </div>

            <div class="left-content">

                <div class="image-box image-one">
                    👩🏻‍🤝‍👩🏻
                </div>

                <div class="image-box image-two">
                    📷
                </div>

                <div class="image-box image-three">
                    🎧
                </div>

                <div class="heart">
                    ♥
                </div>

                <h1>
                    Explore<br>
                    the things<br>
                    <span>you love.</span>
                </h1>

            </div>

        </div>


        <!-- RIGHT SIDE -->

        <div class="login-right">

            <div class="login-box">

                <h2>Log in to Facebook</h2>

                <form id="loginForm">

                    <input
                        type="text"
                        id="loginEmail"
                        placeholder="Email address or mobile number"
                        required
                    >

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Password"
                        required
                    >

                    <a href="dashboard.html" class="login-btn">Log in</a>

                </form>


                <a href="#" class="forgot">
                    Forgotten password?
                </a>


                <div class="line"></div>


               <a href="signup.html" class="create-btn">Create new account</a>

                <div class="meta">
                    ∞ Meta
                </div>

            </div>

        </div>

    </div>


</body>
</html>
